site_name: Portal Orc
site_description: Documentação do Projeto - DiProjOrcestra

theme:
  name: material
  language: pt
  palette:
    # Configuração de cores semelhante ao Portal Orc
    primary: custom
    accent: custom
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight

extra_css:
  - stylesheets/extra.css

nav:
  - Início: index.md
  - Estratégias:
      - Estratégia de Engenharia: estrategias/engenharia.md
      - Engenharia de Requisitos: estrategias/requisitos.md
  - Gestão de Produto:
      - Solução Proposta: gestao-produto/solucao-proposta.md
      - Requisitos do Projeto: gestao-produto/requisitos.md
  - Acompanhamento:
      - Cronograma e Entregas: acompanhamento/cronograma.md
  - Padrões:
      - Padrão de Commits: padroes/commits.md
      - Padrão de Issues: padroes/issues.md
